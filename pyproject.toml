[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lectern"
version = "0.1.0"
description = "Turn readings into navigable audio, and study alongside them"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dev Munene" }]
keywords = ["audiobook", "tts", "pdf", "piper", "study", "accessibility"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing",
]
dependencies = [
    "pymupdf>=1.24",
    "piper-tts>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Console scripts, never chmod +x -- the library lives on NTFS where the
# executable bit does not survive.
[project.scripts]
lectern = "lectern.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lectern = ["schema.sql", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
